<!DOCTYPE HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achadora de zeroneitor 3000</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/HT80T29P/Pngtree-ufo-spacecraft-science-fiction-technology-5752948.png">
<!-- Toda a sessão <style> foi feita por IA para poupar tempo, essa foi a única participação da IA
exceto posteriormente para revisão final do código, toda a sessão <body> foi feita por mim-->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container principal dividindo a página em 3 colunas */
        .layout-principal {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1500px;
        }

        /* Coluna da Esquerda: todos os elementos da calculadora */
        .coluna-calculadora {
            flex: 1;
            min-width: 320px;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Coluna do Meio: espaço para o passo a passo da resolução */
        .coluna-passos {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            position: relative;
            background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px dashed #818cf8;
            border-radius: 16px;
            padding: 26px 18px 18px 18px;
            color: #e2e8f0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 300px;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.15), inset 0 0 12px rgba(56, 189, 248, 0.1);
            word-wrap: break-word;
        }

        /* Etiqueta decorativa no topo da coluna de passos */
        .coluna-passos::before {
            content: "🛠️ PASSO A PASSO";
            position: absolute;
            top: -12px;
            left: 14px;
            background: linear-gradient(90deg, #38bdf8, #4f46e5);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.4);
        }

        /* Coluna da Direita: imagem lateral */
        .coluna-imagem {
            flex: 1;
            min-width: 300px;
            max-width: 672.6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coluna-imagem img {
            width: 100%;
            height: auto;
            max-height: 618px;
            object-fit: contain;
            border-radius: 24px;
            border: 2px solid rgba(129, 140, 248, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
        }

        br {
            display: none;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            text-align: left;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .coluna-calculadora > p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        /* Card do Formulário */
        #form {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #form p {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #cbd5e1;
            margin-top: 6px;
        }

        #form p:first-child {
            margin-top: 0;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            font-family: 'Consolas', monospace;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Botão Principal */
        button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.35);
            transition: transform 0.15s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Caixa de Resposta Lúdica */
        #resposta {
            width: 100%;
            position: relative;
            margin-top: 20px;
            padding: 24px 16px 16px 16px;
            border-radius: 16px;
            background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px dashed #38bdf8;
            color: #fef08a;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25), inset 0 0 12px rgba(129, 140, 248, 0.15);
            animation: surgimento 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Etiqueta decorativa no topo da caixa de resposta */
        #resposta::before {
            content: "⚡ RESULTADO";
            position: absolute;
            top: -12px;
            left: 14px;
            background: linear-gradient(90deg, #f59e0b, #ec4899);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
        }

        /* Esconde a caixa de resposta enquanto estiver vazia */
        #resposta:empty {
            display: none;
        }

        @keyframes surgimento {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Responsividade refinada para telas/guias menores (Notebooks compactos ou janelas redimensionadas) */
        @media (max-width: 1280px) {
            .layout-principal {
                flex-wrap: wrap;
                justify-content: center;
            }
            .coluna-calculadora, .coluna-passos {
                max-width: 450px;
            }
            .coluna-imagem {
                max-width: 100%;
                margin-top: 10px;
            }
            .coluna-imagem img {
                max-height: 400px;
            }
        }

        @media (max-width: 850px) {
            .layout-principal {
                flex-direction: column;
                align-items: center;
            }
            .coluna-calculadora, .coluna-passos, .coluna-imagem {
                width: 100%;
                max-width: 500px;
            }
            h1 {
                text-align: center;
            }
            .coluna-calculadora {
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="layout-principal">
    <!-- Coluna da calculadora -->
    <div class="coluna-calculadora">
        <h1>Achadora de zeroneitor 3000</h1><br>
        <h2>Agora inclui números complexos!</h2><br>
        <p>Digite os elementos da equação</p>

        <!--A partir daqui, o usuário digita cada elemento separadamente, para facilitar a manipulação dos
        elementos-->
        <form id="form">
        <p>Elemento "a"</p><input id="elemento_a" type="number">
        <p>Elemento "b"</p><input id="elemento_b" type="number">
        <p>Elemento "c"</p><input id="elemento_c" type="number">
        </form>

        <!-- Botão de input, inicia a função que analísa o caso e gera o resultado -->
        <button onclick="calcular();">Calcular</button>
        <!-- Espaço para ser sobrescrito com a resposta -->
        <div id="resposta"></div>
    </div>

    <!-- Espaço pra passo a passo -->
    <div class="coluna-passos" id="passos-resolucao">
        Aguardando cálculo para gerar o passo a passo...
    </div>

    <!-- Fluxograma -->
    <div class="coluna-imagem">
        <img src="https://i.ibb.co/b5XpyKfx/Captura-de-tela-2026-11-24-163843.png" alt="Imagem lateral">
    </div>
</div>

<script>
// Substitui a div "resposta"
   let resposta1 = document.getElementById('resposta');
   let passosDiv = document.getElementById('passos-resolucao');

   document.getElementById("form").addEventListener("submit", function(event){
            event.preventDefault();});
            
    function calcular(){
        let a = document.getElementById('elemento_a').value;
        let b = document.getElementById('elemento_b').value;
        let c = document.getElementById('elemento_c').value;
        let delta = (b ** 2)-(4*a*c);
        // Raizes, em caso de função de segundo grau
        let x1 = 0;
        let x2 = 0;
        // Zero, em caso de função de primeiro grau
        let x = 0;
        let complexo = 0;
        let divisor = 0;
        
        if (a == 0){
            if(b == 0){
                if(c == 0){
                    resposta1.innerText = (`Resultado: 0`);
                    passosDiv.innerText = `Temos 0x^2 + 0x + 0 = 0`;
                }else{
                    resposta1.innerText = (`Não existe uma equação, pois a implicação de a = 0 e b = 0 leva à resposta ${c} = 0, oque está matematicamente incorreto. Conjunto solução vazio, 𝑆 = ∅`);
                }
                
            }else{
                x = -1 * (c/b);
                resposta1.innerText = (`Resultado: ${x}`);
                passosDiv.innerText = `Passo a passo: Como a = 0, a equação é do 1° grau. Fórmula aplicada com base nos coeficientes b e c. Assim, aplicamos -(c/b), substituindo, temos -(${b}/${c}) = ${x}`;
            }
        }else{
            if(delta >= 0){
                if(delta == 0){
                    x1 = (-b)/(2 * a);
                    x2 = x1;
                    resposta1.innerText = (`Resultado: ${x1.toFixed(2)} e ${x2.toFixed(2)}`);
                    passosDiv.innerText = `Passo a passo: Como a ≠ 0, temos uma equação de 2° grau. Agora, temos que olhar para o Δ(delta), dado por Δ = b² - 4ac, substituindo, Δ = (${b})² - 4(${a})(${c}) = ${delta}. 
                    Como Δ = 0, zeramos a raiz da fórmula de Bhaskara, (-b ± 0) / (2a), substituindo, -(${b}) / 2 . ${a} => x = {${x1} e ${x2} (tecnicamente duas raizes, mas idênticas)`;
                }else{
                    x1 = (-b + (delta ** 0.5))/(2 * a);
                    x2 = (-b - (delta ** 0.5))/(2 * a);
//.toFixed(2) devolve o valor com a parte decimal limitada a duas casas, já que a maioria das vezes ela tem dezenas de números após a vírgula
                    resposta1.innerText = (`Resultado: ${x1.toFixed(2)} e ${x2.toFixed(2)}`);
                    passosDiv.innerText = `Passo a passo: Como a ≠ 0, temos uma equação de 2° grau. Agora, temos que olhar para o Δ(delta), dado por Δ = b² - 4ac, substituindo, Δ = (${b})² - 4(${a})(${c}) = ${delta}. 
                    Como Δ > 0, aplicamos Bhaskara normalmente, (-b ± √Δ) / (2a), substituindo, -((${b}) ± √${delta}) / 2 . ${a} => x = {${x1} e ${x2}`;
                }
            }else{
// Math.abs devolve o valor modular do número
                complexo = (Math.abs(delta)) ** 0.5;
                divisor = 2 * a;
                resposta1.innerText = (`Resultado: x = { ${(-b)/(divisor)} + ${(complexo.toFixed(2))/(divisor)}i e ${(-b)/(divisor)} - ${(complexo.toFixed(2))/(divisor)}i }`);
                passosDiv.innerText = `Como a ≠ 0, temos uma equação de 2° grau. Agora, temos que olhar para o Δ(delta), dado por Δ = b² - 4ac, substituindo, Δ = (${b})² - 4(${a})(${c}) = ${delta}. 
                Como Δ < 0, essa equação vai gerar raízes complexas, com parte imaginária, por tanto separamos a raiz em duas raizes, uma real e outra imaginária, formando a parte imaginária do número: 
                √${delta} = √${Math.abs(delta)} . √-1; √-1 = i (Unidade imaginária). Segundo as propriedades das operações complexas, devemos então simplificar os números reais sem mexer no número imaginário, que é representado por i. 
                -${b} ± √${Math.abs(delta)}i = ${-b} ± √${complexo.toFixed(2)}i. Simplificando o divisor, temos a resposta x = {${(-b)/(divisor)} ± √${(complexo.toFixed(2))/(divisor)}i}`;
            }
        }
    }
</script>
</body>
</html>
